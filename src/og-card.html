<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0e2a45;
    color: #f7f5f0;
    font-family: "Source Han Sans SC", "Microsoft YaHei", Inter, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 84px;
    position: relative;
  }
  .rule-top { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #c2a577; }
  .glow {
    position: absolute; right: -120px; top: -160px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(194,165,119,0.20), transparent 66%);
  }
  .eyebrow {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 15px; letter-spacing: 0.36em; text-transform: uppercase; color: #c2a577;
  }
  h1 {
    font-family: "Source Han Serif SC", "Songti SC", Georgia, serif;
    font-size: 76px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600;
    margin-top: 26px;
  }
  .sub {
    font-family: "Source Han Serif SC", "Songti SC", Georgia, serif;
    font-style: italic; font-size: 31px; color: #cfd9e3; margin-top: 20px;
  }
  .cn { font-size: 22px; color: #9fb3c6; margin-top: 14px; letter-spacing: 0.04em; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .meta { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; color: #8fa6ba; }
  .mark { display: flex; gap: 10px; align-items: center; }
  .dot { width: 10px; height: 10px; background: #c2a577; }
</style>
</head>
<body>
  <div class="rule-top"></div>
  <div class="glow"></div>
  <div>
    <p class="eyebrow">Classics Library</p>
    <h1>Read the classics.<br>Think deeper.</h1>
    <p class="sub">Build your model of the world through the classics.</p>
    <p class="cn">用经典书籍，建立自己的世界模型</p>
  </div>
  <div class="foot">
    <p class="meta">100 Classics · 11 Categories · 5 Reading Paths · Bilingual</p>
    <p class="mark"><span class="dot"></span><span class="meta">Curated by Rayman</span></p>
  </div>
</body>
</html>
