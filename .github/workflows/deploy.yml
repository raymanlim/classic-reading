name: Build & Deploy

# 触发：push 到 main，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只需读代码
permissions:
  contents: read

# 同一分支的连续推送只保留最后一次，避免并发部署互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 本项目零 npm 依赖，不需要 npm install
      - name: Build
        run: node src/build.mjs

      # 门禁：数据完整性 + 死链。不通过就不部署，避免坏站点上公网
      - name: Verify
        run: node src/check.mjs

      # ── Cloudflare Pages 部署（备用通道）──────────────────────────────
      #
      # 🔴 为什么这么写：GitHub Actions 的**步骤级 `if` 里不允许使用 `secrets` 上下文**
      #    （只有 env / steps / github / needs / vars / inputs 等可用）。
      #    直接写 `if: ${{ secrets.X != '' }}` 会让**整个工作流文件被判非法**，
      #    表现为运行名变成文件路径、jobs 数为 0、startup_failure —— 2026-10-13 实证。
      #    正确做法：先把 secret 映射成 env，用 shell 探测，再用 `steps.<id>.outputs` 判断。
      #
      # 行为：未配置 secret → 部署步骤被**跳过**（作业保持绿色，不再发失败邮件）；
      #       一旦补上 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID → 自动开始部署。
      #
      # 说明：当前对外唯一入口是 WorkBuddy App Publishing
      #       （https://0e00525f540948a2b66f58b8a0e4962d.sg2.agentos-app.run），
      #       本步骤只影响 Cloudflare 这条备用通道，不影响对外站点。
      - name: Check Cloudflare secrets
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare 凭据已配置，将执行部署。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Pages 部署已跳过::仓库未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。构建与校验均已通过；对外站点由 WorkBuddy App Publishing 提供，不受影响。"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=classic-reading --branch=main

